name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lbfp-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/lbfp"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lbfp/release.jks"
          echo "LBFP_KEYSTORE_PATH=$RUNNER_TEMP/lbfp/release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/lbfp/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }} assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/LBFP-Customer.apk
          sha256sum release/LBFP-Customer.apk > release/SHA256SUMS.txt
      - name: Publish or replace release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "LBFP Customer App 1.0.${{ github.run_number }}" --notes "## Laddu Bhai Food Point — Android Customer App\n\n**Build:** 1.0.${{ github.run_number }}  \n**Package:** `com.laddufoodpoint`  \n**Branch:** `main`  \n**Commit:** `${{ github.sha }}`\n\n### What’s included\n- Redesigned food-first home screen with compact search, photo-led categories and a promotional food banner\n- Popular dishes and full menu with item-specific imagery, serving choices and cart quantity controls\n- Cart, delivery/pickup checkout, saved customer details and order history\n- Automatic road-distance lookup for delivery fee estimates\n- System, light and dark appearance settings\n- Android system-bar and gesture-navigation insets\n\n### Downloads\n- `LBFP-Customer.apk` — signed Android release APK\n- `SHA256SUMS.txt` — SHA-256 checksum for integrity verification\n\n### Important\nOrders are stored locally on the device. Live restaurant dispatch, tracking and payment gateway integration are not connected in this build. Delivery fee calculation requires a resolvable address and routing service."
          else
            gh release create latest --title "LBFP Customer App 1.0.${{ github.run_number }}" --notes "## Laddu Bhai Food Point — Android Customer App\n\n**Build:** 1.0.${{ github.run_number }}  \n**Package:** `com.laddufoodpoint`  \n**Branch:** `main`  \n**Commit:** `${{ github.sha }}`\n\n### What’s included\n- Redesigned food-first home screen with compact search, photo-led categories and a promotional food banner\n- Popular dishes and full menu with item-specific imagery, serving choices and cart quantity controls\n- Cart, delivery/pickup checkout, saved customer details and order history\n- Automatic road-distance lookup for delivery fee estimates\n- System, light and dark appearance settings\n- Android system-bar and gesture-navigation insets\n\n### Downloads\n- `LBFP-Customer.apk` — signed Android release APK\n- `SHA256SUMS.txt` — SHA-256 checksum for integrity verification\n\n### Important\nOrders are stored locally on the device. Live restaurant dispatch, tracking and payment gateway integration are not connected in this build. Delivery fee calculation requires a resolvable address and routing service."
          fi
          gh release upload latest release/LBFP-Customer.apk release/SHA256SUMS.txt --clobber
      - name: Update source archives to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
