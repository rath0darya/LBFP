name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lbfp-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/lbfp"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lbfp/release.jks"
          echo "LBFP_KEYSTORE_PATH=$RUNNER_TEMP/lbfp/release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/lbfp/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }} assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/LBFP-Customer.apk
          sha256sum release/LBFP-Customer.apk > release/SHA256SUMS.txt
      - name: Publish or replace release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "LBFP Customer App" --notes "Latest signed APK build ${{ github.run_number }}. Package com.laddufoodpoint."
          else
            gh release create latest --title "LBFP Customer App" --notes "Latest signed APK. Package com.laddufoodpoint."
          fi
          gh release upload latest release/LBFP-Customer.apk release/SHA256SUMS.txt --clobber
