name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lbfp-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/lbfp"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lbfp/release.jks"
          echo "LBFP_KEYSTORE_PATH=$RUNNER_TEMP/lbfp/release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/lbfp/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Prepare exact app icon and in-app logo
        run: |
          python3 -m venv "$RUNNER_TEMP/image-tools"
          "$RUNNER_TEMP/image-tools/bin/python" -m pip install --disable-pip-version-check Pillow
          "$RUNNER_TEMP/image-tools/bin/python" - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("temp/AppIcon.png")
          if not source.is_file():
              raise SystemExit("Required source image temp/AppIcon.png is missing from this commit; check that the artwork is committed to main.")
          image = Image.open(source).convert("RGBA")
          res = Path("app/src/main/res")
          (res / "drawable-nodpi").mkdir(parents=True, exist_ok=True)
          image.save(res / "drawable-nodpi/app_logo.png", format="PNG")
          # Use the supplied artwork unchanged; resize only for Android launcher density variants.
          for folder, size in [("mipmap-mdpi",48),("mipmap-hdpi",72),("mipmap-xhdpi",96),("mipmap-xxhdpi",144),("mipmap-xxxhdpi",192)]:
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = image.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(target / "ic_launcher.png", format="PNG")
              icon.save(target / "ic_launcher_round.png", format="PNG")
          # The existing adaptive-icon XML would override the provided image on Android 8+.
          # Remove it so Android uses the exact supplied launcher artwork on every density.
          for path in (res / "mipmap-anydpi-v26/ic_launcher.xml", res / "mipmap-anydpi-v26/ic_launcher_round.xml"):
              if path.exists(): path.unlink()
          PY
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }} assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/LBFP-Customer.apk
          sha256sum release/LBFP-Customer.apk > release/SHA256SUMS.txt
      - name: Publish or replace release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          # Laddu Bhai Food Point — Android Customer App

          **Build:** 1.0.${{ github.run_number }}  
          **Package:** `com.laddufoodpoint`  
          **Branch:** `main`  
          **Commit:** `${{ github.sha }}`

          ## Included
          - Food-first home screen with compact search, photo-led categories and promotional hero
          - Full menu, item images, serving options and cart quantity controls
          - Delivery/pickup checkout, saved customer details and order history
          - Optional free-text food preference saved with the current order
          - App-wide dark theme for backgrounds, cards, text fields, navigation and system bars
          - Emerald-and-gold launcher identity

          ## Downloads
          - `LBFP-Customer.apk` — signed Android release APK
          - `SHA256SUMS.txt` — SHA-256 checksum for integrity verification

          ## Integration notes
          Orders are stored locally on this device. Live restaurant dispatch, tracking and payment gateway integration are not connected. Delivery fee estimates require a resolvable address and routing service.
          NOTES
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Laddu Bhai Customer App 1.0.${{ github.run_number }}" --notes-file release-notes.md
          else
            gh release create latest --title "Laddu Bhai Customer App 1.0.${{ github.run_number }}" --notes-file release-notes.md
          fi
          gh release upload latest release/LBFP-Customer.apk release/SHA256SUMS.txt --clobber
      - name: Update source archives to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
